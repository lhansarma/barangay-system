<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request Document - eBarangay</title>
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: #f4f6f9; padding: 20px; }
  .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  h2 { color: #2c3e50; margin-bottom: 20px; text-align: center; }
  .form-group { margin-bottom: 15px; }
  label { display: block; font-weight: bold; color: #34495e; margin-bottom: 5px; }
  input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #3498db; }
  .btn { width: 100%; padding: 14px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
  .btn:hover { background: #229954; }
  .btn:disabled { background: #95a5a6; cursor: not-allowed; }
  .btn-back { display: block; text-align: center; margin-top: 15px; color: #7f8c8d; text-decoration: none; font-size: 14px; }
  .btn-back:hover { text-decoration: underline; }
  .error { background: #f8d7da; color: #721c24; padding: 12px; border-radius: 8px; margin-bottom: 20px; display: none; text-align: center; }
  .success { background: #d4edda; color: #155724; padding: 12px; border-radius: 8px; margin-bottom: 20px; display: none; text-align: center; }
</style>
</head>
<body>

<div class="container">
  <h2>📄 Request Document</h2>

  <div class="error" id="error-box"></div>
  <div class="success" id="success-box"></div>

  <form id="request-form" onsubmit="return handleRequest(event)">
    <div class="form-group">
      <label>Document Type</label>
      <select id="doc_type" required onchange="togglePurpose()">
        <option value="">Select Document</option>
        <option value="Barangay Clearance">Barangay Clearance</option>
        <option value="Certificate of Residency">Certificate of Residency</option>
        <option value="Certificate of Indigency">Certificate of Indigency</option>
      </select>
    </div>

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="fullname" required>
    </div>

    <div class="form-group">
      <label>Contact Number</label>
      <input type="text" id="contact" required>
    </div>

    <div class="form-group">
      <label>Address</label>
      <input type="text" id="address" required>
    </div>

    <!-- Dynamic Purpose Fields -->
    <div class="form-group" id="purpose-clearance" style="display:none;">
      <label>Purpose (Clearance)</label>
      <input type="text" id="purpose_clearance">
    </div>
    <div class="form-group" id="purpose-residency" style="display:none;">
      <label>Purpose (Residency)</label>
      <input type="text" id="purpose_residency">
    </div>
    <div class="form-group" id="purpose-indigency" style="display:none;">
      <label>Purpose (Indigency)</label>
      <input type="text" id="purpose_indigency">
    </div>

    <div class="form-group">
      <label>Years of Residency (Optional)</label>
      <input type="number" id="years_residency" placeholder="e.g. 5">
    </div>

    <div class="form-group">
      <label>Additional Notes (Optional)</label>
      <textarea id="notes" rows="3"></textarea>
    </div>

    <button type="submit" id="submit-btn" class="btn">Submit Request</button>
  </form>

  <a href="resident_dashboard.html" class="btn-back">← Back to Dashboard</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://kbngzddelbmpdbhxevon.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_acy7Ulw_hTPGY4zPVSBUoA_xm0HeXb_';
  const { createClient } = supabase;
  const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

  // Auto-fill user data on load
  async function prefillUser() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      window.location.href = 'login.html';
      return;
    }
    document.getElementById('fullname').value = session.user.user_metadata?.full_name || '';
    document.getElementById('contact').value = session.user.user_metadata?.contact_number || '';
    document.getElementById('address').value = session.user.user_metadata?.address || '';
  }
  prefillUser();

  function togglePurpose() {
    const type = document.getElementById('doc_type').value;
    document.getElementById('purpose-clearance').style.display = type === 'Barangay Clearance' ? 'block' : 'none';
    document.getElementById('purpose-residency').style.display = type === 'Certificate of Residency' ? 'block' : 'none';
    document.getElementById('purpose-indigency').style.display = type === 'Certificate of Indigency' ? 'block' : 'none';
  }

  async function handleRequest(e) {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    btn.disabled = true; btn.textContent = 'Submitting...';

    const doc_type = document.getElementById('doc_type').value;
    let purpose = '';
    if (doc_type === 'Barangay Clearance') purpose = document.getElementById('purpose_clearance').value;
    if (doc_type === 'Certificate of Residency') purpose = document.getElementById('purpose_residency').value;
    if (doc_type === 'Certificate of Indigency') purpose = document.getElementById('purpose_indigency').value;

    const { data: { session } } = await supabaseClient.auth.getSession();

    // Insert into Supabase Database
    const { error } = await supabaseClient
      .from('requests')
      .insert([{
        user_id: session.user.id,
        doc_type: doc_type,
        fullname: document.getElementById('fullname').value,
        contact: document.getElementById('contact').value,
        address: document.getElementById('address').value,
        years_residency: document.getElementById('years_residency').value || null,
        notes: document.getElementById('notes').value,
        purpose: purpose,
        status: 'Pending'
      }]);

    btn.disabled = false; btn.textContent = 'Submit Request';

    if (error) {
      alert("Error: " + error.message);
    } else {
      document.getElementById('request-form').style.display = 'none';
      const sBox = document.getElementById('success-box');
      sBox.textContent = "✅ Request submitted successfully! Redirecting to dashboard...";
      sBox.style.display = 'block';
      setTimeout(() => { window.location.href = 'resident_dashboard.html'; }, 2000);
    }
    return false;
  }
</script>
</body>
</html>
