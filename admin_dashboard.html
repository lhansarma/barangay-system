<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - eBarangay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

  <div class="dashboard-shell">
    <aside class="sidebar">
      <div>
        <ul class="nav-list">
          <div class="active-indicator"></div>
          
          <li class="nav-item active">
            <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M11.47 3.84a.75.75 0 011.06 0l8.69 8.69a.75.75 0 101.06-1.06l-8.689-8.69a2.25 2.25 0 00-3.182 0l-8.69 8.69a.75.75 0 001.061 1.06l8.69-8.69z" /><path d="M12 5.432l8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 01-.75-.75v-4.5a.75.75 0 00-.75-.75h-3a.75.75 0 00-.75.75V21a.75.75 0 01-.75.75H5.625a1.875 1.875 0 01-1.875-1.875v-6.198a2.29 2.29 0 00.091-.086L12 5.43z" /></svg></span>
            <span>Admin Dashboard</span>
          </li>
          
          <li class="nav-item" onclick="window.location.href='admin_upload.html'">
            <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M11.47 2.47a.75.75 0 011.06 0l4.5 4.5a.75.75 0 01-1.06 1.06l-3.22-3.22V16.5a.75.75 0 01-1.5 0V4.81L8.03 8.03a.75.75 0 01-1.06-1.06l4.5-4.5zM3 15.75a.75.75 0 01.75.75v2.25a1.5 1.5 0 001.5 1.5h13.5a1.5 1.5 0 001.5-1.5V16.5a.75.75 0 011.5 0v2.25a3 3 0 01-3 3H5.25a3 3 0 01-3-3V16.5a.75.75 0 01.75-.75z" clip-rule="evenodd" /></svg></span>
            <span>Manage Documents</span>
          </li>

          <li class="nav-item" onclick="window.location.href='audit_logs.html'">
            <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M5.625 1.5H9a3.75 3.75 0 013.75 3.75v1.875c0 1.036.84 1.875 1.875 1.875H16.5a3.75 3.75 0 013.75 3.75v7.875c0 1.035-.84 1.875-1.875 1.875H5.625a1.875 1.875 0 01-1.875-1.875V3.375c0-1.036.84-1.875 1.875-1.875zM12 9.75a.75.75 0 000 1.5h3a.75.75 0 000-1.5h-3zm0 3a.75.75 0 000 1.5h3a.75.75 0 000-1.5h-3zm-3.75-.75a.75.75 0 100-1.5.75.75 0 000 1.5zm0 3a.75.75 0 100-1.5.75.75 0 000 1.5z" clip-rule="evenodd" /></svg></span>
            <span>System Logs</span>
          </li>
        </ul>
      </div>
      
      <div class="profile-card">
        <div class="avatar-ring"><img src="https://placehold.co/80x80/1d3557/ffffff?text=A" class="avatar-img" /></div>
        <div class="w-full overflow-hidden">
          <div class="text-sm font-semibold truncate" id="admin-name">Loading...</div>
          <div class="text-xs text-white/70">Administrator</div>
        </div>
        <button onclick="handleLogout(event)" class="text-white/50 hover:text-red-400 ml-auto flex-shrink-0" title="Logout">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        </button>
      </div>
    </aside>

    <main class="main-content">
      <header class="mb-8">
        <h1 class="header-title">Admin Overview</h1>
        <p class="header-subtitle">Manage resident requests and generate documents.</p>
      </header>

      <section class="stats-grid">
        <div class="stat-card">
          <div class="stat-badge" style="background: #0275ff;"><svg width="24" height="24" fill="white" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg></div>
          <div><span id="total-req" class="stat-number">0</span><span class="stat-label">Total Requests</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-badge" style="background: #d68910;"><svg width="24" height="24" fill="white" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg></div>
          <div><span id="pending-req" class="stat-number">0</span><span class="stat-label">Pending Requests</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-badge" style="background: #2980b9;"><svg width="24" height="24" fill="white" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg></div>
          <div><span id="total-docs" class="stat-number">0</span><span class="stat-label">Total Documents</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-badge" style="background: #8e44ad;"><svg width="24" height="24" fill="white" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg></div>
          <div><span id="pending-docs" class="stat-number">0</span><span class="stat-label">Pending Docs</span></div>
        </div>
      </section>

      <section class="table-container">
        <div class="flex justify-between items-center mb-4 flex-wrap gap-4">
          <h2 class="text-lg font-semibold">All Requests</h2>
          <div class="flex gap-2 flex-wrap">
            <input type="text" id="search-input" class="filter-input" placeholder="Search by name...">
            <select id="status-filter" class="filter-input">
              <option value="">All Status</option>
              <option value="Pending">Pending</option>
              <option value="Approved">Approved</option>
              <option value="Rejected">Rejected</option>
            </select>
            <button onclick="fetchRequests()" class="btn-sm bg-[#0275ff] text-white px-4 py-2 rounded-lg">Filter</button>
          </div>
        </div>
        
        <div class="overflow-x-auto">
          <table id="requests-table">
            <thead>
              <tr>
                <th>Req #</th>
                <th>Resident Name</th>
                <th>Document Type</th>
                <th>Status</th>
                <th>Pickup Schedule</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="admin-table-body"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js"></script>
</body>
</html>
