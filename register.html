<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - eBarangay Borongan</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: linear-gradient(135deg, #27ae60, #229954); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 30px 20px; }
    .register-box { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); width: 100%; max-width: 500px; }
    h2 { text-align: center; color: #2c3e50; margin-bottom: 10px; }
    p { text-align: center; color: #7f8c8d; margin-bottom: 30px; font-size: 14px; }
    .form-row { display: flex; gap: 15px; }
    .form-row .form-group { flex: 1; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; color: #2c3e50; font-weight: 600; font-size: 14px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 15px; border: 2px solid #ecf0f1; border-radius: 8px; font-size: 15px; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #27ae60; outline: none; }
    
    /* Password wrapper styles */
    .password-wrapper { position: relative; }
    .password-wrapper input { padding-right: 60px; }
    .toggle-password { 
      position: absolute; 
      right: 12px; 
      top: 50%; 
      transform: translateY(-50%); 
      cursor: pointer; 
      font-size: 13px; 
      color: #27ae60; 
      font-weight: 600;
      user-select: none; 
    }
    .toggle-password:hover { color: #229954; text-decoration: underline; }

    .btn { width: 100%; padding: 14px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
    .btn:hover { background: #229954; }
    .btn:disabled { background: #95a5a6; cursor: not-allowed; }
    .btn-back { background: #95a5a6; text-decoration: none; display: block; text-align: center; color: white; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 15px; margin-bottom: 10px; transition: 0.3s; }
    .btn-back:hover { background: #7f8c8d; }
    .error { background: #f8d7da; color: #721c24; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; display: none; }
    .success { background: #d4edda; color: #155724; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; display: none; }
    .logo { text-align: center; margin-bottom: 20px; font-size: 40px; }
    .bottom-link { text-align: center; margin-top: 20px; font-size: 14px; color: #7f8c8d; }
    .bottom-link a { color: #3498db; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="register-box">
    <div class="logo">📝</div>
    <h2>Create Account</h2>
    <p>We will send a verification email to your inbox</p>

    <div class="error" id="error-box"></div>
    <div class="success" id="success-box"></div>

    <form id="register-form" onsubmit="return handleRegister(event)">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="fullname" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label>Contact Number</label>
          <input type="text" id="contact" required>
        </div>
      </div>
      <div class="form-group">
        <label>Address</label>
        <textarea id="address" rows="2" required></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Birthdate</label>
          <input type="date" id="birthdate" required>
        </div>
        <div class="form-group">
          <label>Gender</label>
          <select id="gender" required>
            <option value="">Select</option>
            <option>Male</option>
            <option>Female</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" required minlength="8">
            <span class="toggle-password" onclick="togglePassword('password', this)">Show</span>
          </div>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <div class="password-wrapper">
            <input type="password" id="confirm_password" required minlength="8">
            <span class="toggle-password" onclick="togglePassword('confirm_password', this)">Show</span>
          </div>
        </div>
      </div>
      <button type="submit" id="submit-btn" class="btn">Create Account</button>
    </form>

    <div class="bottom-link">
      Already have an account? <a href="login.html">Login here</a>
    </div>

    <a href="index.html" class="btn-back">← Back to Home</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://kbngzddelbmpdbhxevon.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_acy7Ulw_hTPGY4zPVSBUoA_xm0HeXb_';

    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

    // Function to toggle password visibility with text
    function togglePassword(inputId, element) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        element.textContent = 'Hide';
      } else {
        input.type = 'password';
        element.textContent = 'Show';
      }
    }

    function showError(msg) {
      const box = document.getElementById('error-box');
      box.textContent = msg; box.style.display = 'block';
      document.getElementById('success-box').style.display = 'none';
    }
    function showSuccess(msg) {
      const box = document.getElementById('success-box');
      box.textContent = msg; box.style.display = 'block';
      document.getElementById('error-box').style.display = 'none';
    }

    async function handleRegister(e) {
      e.preventDefault();
      const fullname = document.getElementById('fullname').value.trim();
      const email = document.getElementById('email').value.trim();
      const contact = document.getElementById('contact').value.trim();
      const address = document.getElementById('address').value.trim();
      const birthdate = document.getElementById('birthdate').value;
      const gender = document.getElementById('gender').value;
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm_password').value;

      if (!fullname || !email || !contact || !address || !birthdate || !gender || !password || !confirm) {
        showError('Please fill in all fields.'); return false;
      }
      if (password !== confirm) {
        showError('Password and Confirm Password do not match.'); return false;
      }
      if (password.length < 8) {
        showError('Password must be at least 8 characters.'); return false;
      }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Creating account...';

      const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
          data: {
            full_name: fullname,
            contact_number: contact,
            address: address,
            birthdate: birthdate,
            gender: gender,
            role: 'resident'
          }
        }
      });

      btn.disabled = false;
      btn.textContent = 'Create Account';

      if (error) {
        showError(error.message);
        return false;
      }

      if (data.user && data.session === null) {
        showSuccess('Registration successful! Please check your email to verify your account.');
        document.getElementById('register-form').reset();
      } else if (data.user && data.session) {
        showSuccess('Registration successful! Redirecting to dashboard...');
        setTimeout(() => { window.location.href = 'resident_dashboard.html'; }, 1500);
      }
      return false;
    }
  </script>
</body>
</html>
