<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - eBarangay Borongan</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: linear-gradient(135deg, #27ae60, #229954); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 30px 20px; }
    .register-box { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); width: 100%; max-width: 500px; }
    h2 { text-align: center; color: #2c3e50; margin-bottom: 10px; }
    p { text-align: center; color: #7f8c8d; margin-bottom: 30px; font-size: 14px; }
    .form-row { display: flex; gap: 15px; }
    .form-row .form-group { flex: 1; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; color: #2c3e50; font-weight: 600; font-size: 14px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 15px; border: 2px solid #ecf0f1; border-radius: 8px; font-size: 15px; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #27ae60; outline: none; }
    .btn { width: 100%; padding: 14px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
    .btn:hover { background: #229954; }
    .btn-back { background: #95a5a6; text-decoration: none; display: block; text-align: center; color: white; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 15px; margin-bottom: 10px; transition: 0.3s; }
    .btn-back:hover { background: #7f8c8d; }
    .error { background: #f8d7da; color: #721c24; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; display: none; }
    .success { background: #d4edda; color: #155724; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; display: none; }
    .logo { text-align: center; margin-bottom: 20px; font-size: 40px; }
    .bottom-link { text-align: center; margin-top: 20px; font-size: 14px; color: #7f8c8d; }
    .bottom-link a { color: #3498db; text-decoration: none; font-weight: 600; }
    #otp-section { display: none; }
  </style>
</head>
<body>
  <div class="register-box">
    <div class="logo">📝</div>
    <h2>Create Account</h2>
    <p>We will send an OTP to your email</p>

    <div class="error" id="error-box"></div>
    <div class="success" id="success-box"></div>

    <form id="register-form" onsubmit="return handleRegister(event)">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="fullname" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label>Contact Number</label>
          <input type="text" id="contact" required>
        </div>
      </div>
      <div class="form-group">
        <label>Address</label>
        <textarea id="address" rows="2" required></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Birthdate</label>
          <input type="date" id="birthdate" required>
        </div>
        <div class="form-group">
          <label>Gender</label>
          <select id="gender" required>
            <option value="">Select</option>
            <option>Male</option>
            <option>Female</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required minlength="8">
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="confirm_password" required minlength="8">
        </div>
      </div>
      <button type="submit" class="btn">Create Account &amp; Send OTP</button>
    </form>

    <div id="otp-section">
      <h2>Verify Your Email</h2>
      <p>Enter the OTP we sent to your email</p>
      <form onsubmit="return verifyOTP(event)">
        <div class="form-group">
          <label>OTP Code</label>
          <input type="text" id="otp-input" maxlength="6" placeholder="6-digit code" required>
        </div>
        <button type="submit" class="btn">Verify OTP</button>
      </form>
    </div>

    <div class="bottom-link">
      Already have an account? <a href="login.html">Login here</a>
    </div>

    <a href="index.html" class="btn-back">← Back to Home</a>
  </div>

  <script>
    function getUsers() {
      const raw = localStorage.getItem('ebarangay_users');
      return raw ? JSON.parse(raw) : [];
    }
    function saveUsers(users) {
      localStorage.setItem('ebarangay_users', JSON.stringify(users));
    }
    function findUser(identifier) {
      const users = getUsers();
      const id = identifier.toLowerCase().trim();
      return users.find(u => u.email.toLowerCase() === id || u.username.toLowerCase() === id);
    }
    function showError(msg) {
      const box = document.getElementById('error-box');
      box.textContent = msg; box.style.display = 'block';
      document.getElementById('success-box').style.display = 'none';
    }
    function showSuccess(msg) {
      const box = document.getElementById('success-box');
      box.textContent = msg; box.style.display = 'block';
      document.getElementById('error-box').style.display = 'none';
    }

    let pendingUser = null;
    let pendingOtp = null;
    let pendingOtpTime = null;

    function handleRegister(e) {
      e.preventDefault();
      const fullname = document.getElementById('fullname').value.trim();
      const email = document.getElementById('email').value.trim();
      const contact = document.getElementById('contact').value.trim();
      const address = document.getElementById('address').value.trim();
      const birthdate = document.getElementById('birthdate').value;
      const gender = document.getElementById('gender').value;
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm_password').value;

      if (!fullname || !email || !contact || !address || !birthdate || !gender || !password || !confirm) {
        showError('Please fill in all fields.'); return false;
      }
      if (password !== confirm) { showError('Password and Confirm Password do not match.'); return false; }
      if (password.length < 8) { showError('Password must be at least 8 characters.'); return false; }
      if (findUser(email)) { showError('Email already exists. Please login instead.'); return false; }

      const username = email.split('@')[0];
      const otp = Math.floor(100000 + Math.random() * 900000).toString();
      pendingUser = { fullname, email, contact, address, birthdate, gender, password, username, role: 'resident' };
      pendingOtp = otp;
      pendingOtpTime = Date.now();

      showSuccess('OTP Sent! (Demo OTP: ' + otp + ') - Valid for 10 minutes');
      document.getElementById('register-form').style.display = 'none';
      document.getElementById('otp-section').style.display = 'block';
      return false;
    }

    function verifyOTP(e) {
      e.preventDefault();
      const input = document.getElementById('otp-input').value.trim();

      if (!pendingOtp) { showError('No OTP was sent. Please register again.'); return false; }
      if (Date.now() - pendingOtpTime > 10 * 60 * 1000) { showError('OTP expired. Please register again.'); return false; }
      if (input !== pendingOtp) { showError('Invalid OTP. Please try again.'); return false; }

      const users = getUsers();
      users.push(pendingUser);
      saveUsers(users);

      showSuccess('Email verified successfully! Redirecting to login...');
      document.getElementById('otp-section').style.display = 'none';
      setTimeout(() => { window.location.href = 'login.html'; }, 1800);
      return false;
    }
  </script>
</body>
</html>
