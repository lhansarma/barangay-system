<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - eBarangay Borongan</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #3b4b8b 0%, #2a68ba 45%, #1aa6f8 100%);
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-card: rgba(255, 255, 255, 0.11);
      --glass-border: rgba(255, 255, 255, 0.2);
      --primary: #0275ff;
      --primary-hover: #0060df;
      --success: #27ae60;
      --success-hover: #229954;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
    
    body { 
      background: var(--bg-gradient); 
      min-height: 100vh; 
      color: #ffffff;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* HEADER / NAVBAR */
    header { 
      background: var(--glass-bg); 
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 15px 0; 
      border-bottom: 1px solid var(--glass-border); 
      position: sticky; 
      top: 0; 
      z-index: 100; 
      width: 100%;
    }
    .header-container { width: 90%; max-width: 1200px; margin: auto; display: flex; justify-content: space-between; align-items: center; }
    
    .logo { display: flex; align-items: center; gap: 15px; font-weight: 700; font-size: 18px; color: #ffffff; text-decoration: none; }
    .logo img { width: 60px; height: 45px; border-radius: 8px; object-fit: cover; border: 1px solid var(--glass-border); background: white; padding: 2px; }
    
    .btn-header-back { 
      background: transparent; 
      color: white; 
      padding: 10px 22px; 
      border-radius: 10px; 
      font-weight: 600; 
      font-size: 14px; 
      text-decoration: none;
      border: 2px solid rgba(255,255,255,0.4);
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-header-back:hover { background: rgba(255,255,255,0.1); border-color: #ffffff; transform: translateY(-2px); }

    /* MAIN REGISTER AREA */
    .register-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .register-box { 
      background: var(--glass-card); 
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 40px; 
      border-radius: 22px; 
      width: 100%; 
      max-width: 550px; 
      box-shadow: 0 28px 60px rgba(10, 22, 55, 0.45); 
      border: 1px solid var(--glass-border);
    }

    h2 { text-align: center; color: #ffffff; margin-bottom: 10px; font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
    p.subtitle { text-align: center; color: rgba(255,255,255,0.7); margin-bottom: 30px; font-size: 14px; }
    
    .form-row { display: flex; gap: 15px; }
    .form-row .form-group { flex: 1; }
    .form-group { margin-bottom: 20px; }
    
    .form-group label { display: block; margin-bottom: 8px; color: rgba(255,255,255,0.9); font-weight: 600; font-size: 13px; }
    
    input, select, textarea { 
      width: 100%; 
      padding: 12px 15px; 
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2); 
      border-radius: 10px; 
      font-size: 14px; 
      color: #ffffff;
      transition: 0.2s;
    }
    
    input::placeholder, textarea::placeholder { color: rgba(255, 255, 255, 0.4); }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #1aa6f8; background: rgba(255, 255, 255, 0.15); box-shadow: 0 0 0 3px rgba(26, 166, 248, 0.2); }
    
    /* Fix for select dropdown options color */
    select option { color: #000000; background: #ffffff; }
    
    /* Calendar icon color fix for date input */
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.7; cursor: pointer; }
    
    /* Password wrapper styles */
    .password-wrapper { position: relative; }
    .password-wrapper input { padding-right: 60px; }
    .toggle-password { 
      position: absolute; 
      right: 12px; 
      top: 50%; 
      transform: translateY(-50%); 
      cursor: pointer; 
      font-size: 13px; 
      color: #1aa6f8; 
      font-weight: 600;
      user-select: none; 
      transition: 0.2s;
    }
    .toggle-password:hover { color: #ffffff; }

    .btn { 
      width: 100%; 
      padding: 14px; 
      background: var(--success); 
      color: white; 
      border: none; 
      border-radius: 10px; 
      font-size: 16px; 
      font-weight: 600; 
      cursor: pointer; 
      transition: 0.3s; 
      border: 1px solid rgba(255,255,255,0.1);
      margin-top: 10px;
    }
    .btn:hover { background: var(--success-hover); transform: translateY(-2px); }
    .btn:disabled { background: #7f8c8d; cursor: not-allowed; transform: none; }
    
    .error { background: rgba(231, 76, 60, 0.2); color: #ff8e8e; border: 1px solid rgba(231, 76, 60, 0.4); padding: 12px; border-radius: 10px; margin-bottom: 20px; text-align: center; font-size: 14px; display: none; }
    .success { background: rgba(39, 174, 96, 0.2); color: #7bed9f; border: 1px solid rgba(39, 174, 96, 0.4); padding: 12px; border-radius: 10px; margin-bottom: 20px; text-align: center; font-size: 14px; display: none; }
    
    .logo-icon { text-align: center; margin-bottom: 15px; font-size: 40px; }
    
    .bottom-link { text-align: center; margin-top: 20px; font-size: 14px; color: rgba(255,255,255,0.8); }
    .bottom-link a { color: #1aa6f8; text-decoration: none; font-weight: 600; transition: 0.2s; }
    .bottom-link a:hover { color: #ffffff; text-decoration: underline; }

    /* Responsive */
    @media(max-width: 768px) { 
      .register-box { padding: 30px 20px; }
      .form-row { flex-direction: column; gap: 0; }
    }
  </style>
</head>
<body>
  
  <!-- Header -->
  <header>
    <div class="header-container">
      <a href="index.html" class="logo">
        <img src="logo.jpg" alt="Logo" onerror="this.src='https://placehold.co/60x45/ffffff/0275ff?text=Brgy'">
        eBarangay Borongan
      </a>
      
      <!-- Go Back Button -->
      <a href="index.html" class="btn-header-back">
        ← Back to Home
      </a>
    </div>
  </header>

  <!-- Register Form Area -->
  <div class="register-wrapper">
    <div class="register-box">
      <h2>Create Account</h2>
      <p class="subtitle">We will send a verification email to your inbox</p>

      <div class="error" id="error-box"></div>
      <div class="success" id="success-box"></div>

      <form id="register-form" onsubmit="return handleRegister(event)">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="fullname" placeholder="Juan Dela Cruz" required>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="juan@example.com" required>
          </div>
          <div class="form-group">
            <label>Contact Number</label>
            <input type="text" id="contact" placeholder="09123456789" required>
          </div>
        </div>
        
        <div class="form-group">
          <label>Complete Address</label>
          <textarea id="address" rows="2" placeholder="House No, Street, Purok" required></textarea>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label>Birthdate</label>
            <input type="date" id="birthdate" required>
          </div>
          <div class="form-group">
            <label>Gender</label>
            <select id="gender" required>
              <option value="">Select</option>
              <option>Male</option>
              <option>Female</option>
            </select>
          </div>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label>Password</label>
            <div class="password-wrapper">
              <input type="password" id="password" placeholder="Min 8 chars" required minlength="8">
              <span class="toggle-password" onclick="togglePassword('password', this)">Show</span>
            </div>
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <div class="password-wrapper">
              <input type="password" id="confirm_password" placeholder="Confirm password" required minlength="8">
              <span class="toggle-password" onclick="togglePassword('confirm_password', this)">Show</span>
            </div>
          </div>
        </div>
        
        <button type="submit" id="submit-btn" class="btn">Create Account</button>
      </form>

      <div class="bottom-link">
        Already have an account? <a href="login.html">Login here</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://kbngzddelbmpdbhxevon.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_acy7Ulw_hTPGY4zPVSBUoA_xm0HeXb_';

    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

    // Function to toggle password visibility with text
    function togglePassword(inputId, element) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        element.textContent = 'Hide';
      } else {
        input.type = 'password';
        element.textContent = 'Show';
      }
    }

    function showError(msg) {
      const box = document.getElementById('error-box');
      box.textContent = msg; box.style.display = 'block';
      document.getElementById('success-box').style.display = 'none';
    }
    function showSuccess(msg) {
      const box = document.getElementById('success-box');
      box.textContent = msg; box.style.display = 'block';
      document.getElementById('error-box').style.display = 'none';
    }

    async function handleRegister(e) {
      e.preventDefault();
      const fullname = document.getElementById('fullname').value.trim();
      const email = document.getElementById('email').value.trim();
      const contact = document.getElementById('contact').value.trim();
      const address = document.getElementById('address').value.trim();
      const birthdate = document.getElementById('birthdate').value;
      const gender = document.getElementById('gender').value;
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm_password').value;

      if (!fullname || !email || !contact || !address || !birthdate || !gender || !password || !confirm) {
        showError('Please fill in all fields.'); return false;
      }
      if (password !== confirm) {
        showError('Password and Confirm Password do not match.'); return false;
      }
      if (password.length < 8) {
        showError('Password must be at least 8 characters.'); return false;
      }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Creating account...';

      const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
          data: {
            full_name: fullname,
            contact_number: contact,
            address: address,
            birthdate: birthdate,
            gender: gender,
            role: 'resident'
          }
        }
      });

      btn.disabled = false;
      btn.textContent = 'Create Account';

      if (error) {
        showError(error.message);
        return false;
      }

      if (data.user && data.session === null) {
        showSuccess('Registration successful! Please check your email to verify your account.');
        document.getElementById('register-form').reset();
      } else if (data.user && data.session) {
        showSuccess('Registration successful! Redirecting to dashboard...');
        setTimeout(() => { window.location.href = 'resident_dashboard.html'; }, 1500);
      }
      return false;
    }
  </script>
</body>
</html>
