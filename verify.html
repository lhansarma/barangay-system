<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Document - eBarangay</title>
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: #f4f6f9; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .container { background: white; max-width: 500px; width: 100%; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
  h2 { color: #2c3e50; margin-bottom: 10px; }
  p { color: #7f8c8d; margin-bottom: 30px; font-size: 14px; }
  input { width: 100%; padding: 15px; border: 2px solid #ecf0f1; border-radius: 8px; font-size: 16px; margin-bottom: 15px; text-align: center; letter-spacing: 2px; text-transform: uppercase; }
  input:focus { outline: none; border-color: #3498db; }
  .btn { width: 100%; padding: 15px; background: #3498db; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
  .btn:hover { background: #2980b9; }
  .result { margin-top: 30px; padding: 20px; border-radius: 8px; display: none; }
  .result.valid { background: #d4edda; border: 2px solid #27ae60; color: #155724; }
  .result.invalid { background: #f8d7da; border: 2px solid #e74c3c; color: #721c24; }
  .result h3 { margin-bottom: 10px; font-size: 20px; }
  .result p { color: inherit; margin-bottom: 5px; text-align: left; }
</style>
</head>
<body>

<div class="container">
  <h2>🔍 Document Verification</h2>
  <p>Enter the Document Number found at the bottom of the certificate or scan the QR code.</p>

  <form onsubmit="return verifyDoc(event)">
    <!-- Simulating a document number, e.g., DOC-2026-1001 -->
    <input type="text" id="doc-number" placeholder="e.g. DOC-2026-1001" required>
    <button type="submit" class="btn">Verify Authenticity</button>
  </form>

  <div id="verify-result" class="result">
    <!-- Result will be injected here -->
  </div>
</div>

<script>
  // In a real system, this would query Supabase for the document number
  function verifyDoc(e) {
    e.preventDefault();
    const docNum = document.getElementById('doc-number').value.trim().toUpperCase();
    const resultBox = document.getElementById('verify-result');
    
    resultBox.style.display = 'block';

    // Mock verification logic
    if (docNum === 'DOC-2026-1001') {
      resultBox.className = 'result valid';
      resultBox.innerHTML = `
        <h3>✅ Document is Valid</h3>
        <hr style="margin: 10px 0; border: 0; border-top: 1px solid #27ae60;">
        <p><strong>Document Type:</strong> Barangay Clearance</p>
        <p><strong>Issued To:</strong> Reniel O. Becina</p>
        <p><strong>Date Issued:</strong> October 10, 2026</p>
        <p><strong>Status:</strong> Active</p>
      `;
    } else if (docNum === 'DOC-2026-1002') {
      resultBox.className = 'result invalid';
      resultBox.innerHTML = `
        <h3>⚠️ Document Revoked</h3>
        <p>This document has been cancelled by the Barangay Secretary.</p>
      `;
    } else {
      resultBox.className = 'result invalid';
      resultBox.innerHTML = `
        <h3>❌ Invalid Document</h3>
        <p>No record found. This document may be fake or forged.</p>
      `;
    }
    return false;
  }
</script>
</body>
</html>
