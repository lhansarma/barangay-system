<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Document - eBarangay</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #3b4b8b 0%, #2a68ba 45%, #1aa6f8 100%);
    --glass-bg: rgba(255, 255, 255, 0.08);
    --glass-card: rgba(255, 255, 255, 0.11);
    --glass-border: rgba(255, 255, 255, 0.2);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }
  
  body { 
    background: var(--bg-gradient); 
    min-height: 100vh; 
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    -webkit-font-smoothing: antialiased;
  }

  /* BACK BUTTON */
  .btn-back {
    position: absolute;
    top: 20px;
    left: 20px;
    background: rgba(255, 255, 255, 0.1);
    color: white;
    padding: 10px 20px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14px;
    text-decoration: none;
    border: 2px solid rgba(255,255,255,0.4);
    transition: 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn-back:hover { background: rgba(255,255,255,0.2); border-color: #ffffff; transform: translateY(-2px); }

  .card { 
    background: var(--glass-card); 
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 40px; 
    border-radius: 22px; 
    width: 100%; 
    max-width: 500px; 
    box-shadow: 0 28px 60px rgba(10, 22, 55, 0.45); 
    border: 1px solid var(--glass-border);
    text-align: center;
  }

  h2 { font-size: 26px; font-weight: 700; margin-bottom: 10px; }
  p.subtitle { color: rgba(255,255,255,0.7); font-size: 14px; margin-bottom: 25px; }

  /* Scanner Container */
  #reader {
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    display: none; /* Hidden by default until user clicks scan */
    background: #000;
  }

  /* Manual Input */
  input { 
    width: 100%; 
    padding: 15px; 
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.2); 
    border-radius: 10px; 
    font-size: 16px; 
    color: #ffffff;
    margin-bottom: 15px;
    text-align: center;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: 0.2s;
  }
  input:focus { outline: none; border-color: #1aa6f8; background: rgba(255, 255, 255, 0.15); }

  .btn { 
    width: 100%; 
    padding: 14px; 
    background: #0275ff; 
    color: white; 
    border: none; 
    border-radius: 10px; 
    font-size: 16px; 
    font-weight: 600; 
    cursor: pointer; 
    transition: 0.3s; 
    margin-bottom: 10px;
  }
  .btn:hover { background: #0060df; }
  .btn-scan { background: #27ae60; }
  .btn-scan:hover { background: #229954; }

  /* Results Box */
  .result-box { margin-top: 25px; padding: 25px; border-radius: 12px; text-align: left; display: none; }
  .result-box.valid { background: rgba(39, 174, 96, 0.2); border: 1px solid #2ecc71; }
  .result-box.invalid { background: rgba(231, 76, 60, 0.2); border: 1px solid #e74c3c; }
  .result-box.pending { background: rgba(214, 137, 16, 0.2); border: 1px solid #f1c40f; }
  
  .result-title { font-size: 20px; font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
  .valid .result-title { color: #2ecc71; }
  .invalid .result-title { color: #e74c3c; }
  .pending .result-title { color: #f1c40f; }

  .result-details p { margin-bottom: 8px; font-size: 14px; color: rgba(255,255,255,0.9); }
  .result-details strong { color: #ffffff; }
</style>
</head>
<body>

<!-- Back Button -->
<a href="index.html" class="btn-back">
  ← Back to Home
</a>

<div class="card">
  <h2>Document Verification</h2>
  <p class="subtitle">Scan the QR code or enter the Document Number manually.</p>

  <!-- Camera Scanner -->
  <div id="reader"></div>

  <!-- Manual Form -->
  <form onsubmit="return verifyDoc(event)">
    <input type="text" id="doc-no" placeholder="e.g. DOC-2026-0001" required>
    <button type="submit" class="btn">Verify Authenticity</button>
    <button type="button" class="btn btn-scan" onclick="startScanner()">  Scan QR Code</button>
  </form>

  <!-- Results -->
  <div id="result-box" class="result-box"></div>
</div>

<!-- QR Scanner Library -->
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://kbngzddelbmpdbhxevon.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_acy7Ulw_hTPGY4zPVSBUoA_xm0HeXb_';
  const { createClient } = supabase;
  const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

  let html5QrCode = null;

  // 1. Check if URL has ?code= (e.g. from a scanned link)
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.has('code')) {
    document.getElementById('doc-no').value = urlParams.get('code');
    verifyDoc(new Event('submit'));
  }

  // 2. Start Camera Scanner
  function startScanner() {
    document.getElementById('reader').style.display = 'block';
    
    if (!html5QrCode) {
      html5QrCode = new Html5Qrcode("reader");
    }

    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 250 } },
      (decodedText) => {
        // Success! Stop scanner and verify
        html5QrCode.stop();
        document.getElementById('reader').style.display = 'none';
        
        // The QR code URL looks like: https://site.com/verify.html?code=DOC-2026-0001
        // We extract just the code part
        const url = new URL(decodedText);
        const code = url.searchParams.get('code') || decodedText;
        
        document.getElementById('doc-no').value = code;
        verifyDoc(new Event('submit'));
      },
      (errorMessage) => {
        // Ignore scan errors (happens every frame when no QR is found)
      }
    ).catch(err => {
      alert("Camera error: " + err);
      document.getElementById('reader').style.display = 'none';
    });
  }

  // 3. Verify Document against Database
  async function verifyDoc(e) {
    if(e) e.preventDefault();
    const docNo = document.getElementById('doc-no').value.trim().toUpperCase();
    const resBox = document.getElementById('result-box');
    
    resBox.style.display = 'none';

    // Extract ID from DOC-YYYY-XXXX
    const parts = docNo.split('-');
    if (parts.length < 3 || parts[0] !== 'DOC') {
      showResult('invalid', 'Invalid Format', 'The document number format is incorrect.', resBox);
      return false;
    }

    const reqId = parseInt(parts[2], 10);

    // Query DB
    const { data, error } = await supabaseClient
      .from('requests')
      .select('*')
      .eq('id', reqId)
      .single();

    let scanStatus = 'Invalid';
    
    if (!error && data) {
      // Task 17: Check if Revoked (Rejected)
      if (data.status === 'Rejected') {
        scanStatus = 'Revoked';
        showResult('invalid', '⚠️ Document Revoked', 'This document has been cancelled or revoked by the Barangay.', resBox);
      } 
      // Task 14: Valid Document
      else if (data.status === 'Approved') {
        scanStatus = 'Valid';
        showResult('valid', '✅ Document is Valid', '', resBox, data);
      } 
      else {
        scanStatus = 'Pending';
        showResult('pending', '⏳ Document Pending', 'This document is still being processed by the Barangay.', resBox);
      }
    } else {
      showResult('invalid', '❌ Invalid Document', 'No record found. This document may be fake or forged.', resBox);
    }

    // Task 15: Log the Verification Attempt
    await supabaseClient.from('verification_logs').insert([{
      document_no: docNo,
      status: scanStatus
    }]);

    return false;
  }

  // Helper function to render the result box
  function showResult(type, title, message, box, data = null) {
    box.className = `result-box ${type}`;
    
    let html = `<div class="result-title">${title}</div>`;
    
    if (message) {
      html += `<div class="result-details"><p>${message}</p></div>`;
    }

    if (data) {
      html += `
        <div class="result-details">
          <p><strong>Document:</strong> ${data.doc_type}</p>
          <p><strong>Issued To:</strong> ${data.fullname}</p>
          <p><strong>Purpose:</strong> ${data.purpose || 'N/A'}</p>
          <p><strong>Date Issued:</strong> ${new Date(data.date_requested).toLocaleDateString()}</p>
          <p style="margin-top: 15px; font-size: 12px; color: rgba(255,255,255,0.6);">
            Scanned on: ${new Date().toLocaleString()}
          </p>
        </div>
      `;
    }

    box.innerHTML = html;
    box.style.display = 'block';
  }
</script>
</body>
</html>
