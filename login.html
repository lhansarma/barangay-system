<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - eBarangay Borongan</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #3b4b8b 0%, #2a68ba 45%, #1aa6f8 100%);
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-card: rgba(255, 255, 255, 0.11);
      --glass-border: rgba(255, 255, 255, 0.2);
      --primary: #0275ff;
      --primary-hover: #0060df;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
    
    body { 
      background: var(--bg-gradient); 
      min-height: 100vh; 
      color: #ffffff;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* HEADER / NAVBAR */
    header { 
      background: var(--glass-bg); 
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 15px 0; 
      border-bottom: 1px solid var(--glass-border); 
      position: sticky; 
      top: 0; 
      z-index: 100; 
      width: 100%;
    }
    .header-container { width: 90%; max-width: 1200px; margin: auto; display: flex; justify-content: space-between; align-items: center; }
    
    .logo { display: flex; align-items: center; gap: 15px; font-weight: 700; font-size: 18px; color: #ffffff; text-decoration: none; }
    .logo img { width: 60px; height: 45px; border-radius: 8px; object-fit: cover; border: 1px solid var(--glass-border); background: white; padding: 2px; }
    
    .btn-header-back { 
      background: transparent; 
      color: white; 
      padding: 10px 22px; 
      border-radius: 10px; 
      font-weight: 600; 
      font-size: 14px; 
      text-decoration: none;
      border: 2px solid rgba(255,255,255,0.4);
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-header-back:hover { background: rgba(255,255,255,0.1); border-color: #ffffff; transform: translateY(-2px); }

    /* MAIN LOGIN AREA */
    .login-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .box { 
      background: var(--glass-card); 
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 40px; 
      border-radius: 22px; 
      width: 100%; 
      max-width: 440px; 
      box-shadow: 0 28px 60px rgba(10, 22, 55, 0.45); 
      border: 1px solid var(--glass-border);
    }

    h2 { text-align: center; color: #ffffff; margin-bottom: 25px; font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
    
    /* Password wrapper styles */
    .password-wrapper { position: relative; margin-bottom: 15px; }
    .password-wrapper input { margin-bottom: 0; padding-right: 60px; }
    .toggle-password { 
      position: absolute; 
      right: 15px; 
      top: 50%; 
      transform: translateY(-50%); 
      cursor: pointer; 
      font-size: 13px; 
      color: #1aa6f8; 
      font-weight: 600;
      user-select: none; 
      transition: 0.2s;
    }
    .toggle-password:hover { color: #ffffff; }

    input { 
      width: 100%; 
      padding: 14px 15px; 
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2); 
      border-radius: 10px; 
      box-sizing: border-box; 
      font-size: 15px; 
      color: #ffffff;
      margin-bottom: 15px;
      transition: 0.2s;
    }
    
    input::placeholder { color: rgba(255, 255, 255, 0.5); }
    input:focus { outline: none; border-color: #1aa6f8; background: rgba(255, 255, 255, 0.15); box-shadow: 0 0 0 3px rgba(26, 166, 248, 0.2); }
    
    .btn { 
      width: 100%; 
      padding: 14px; 
      background: var(--primary); 
      color: white; 
      border: none; 
      border-radius: 10px; 
      font-weight: 600; 
      cursor: pointer; 
      font-size: 16px; 
      margin-top: 5px;
      margin-bottom: 15px; 
      transition: 0.3s; 
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    .btn:hover { background: var(--primary-hover); transform: translateY(-2px); }
    .btn:disabled { background: #7f8c8d; cursor: not-allowed; transform: none; }
    
    .error { background: rgba(231, 76, 60, 0.2); color: #ff8e8e; border: 1px solid rgba(231, 76, 60, 0.4); padding: 12px; border-radius: 10px; margin-bottom: 20px; text-align: center; font-size: 14px; display: none; }
    .success { background: rgba(39, 174, 96, 0.2); color: #7bed9f; border: 1px solid rgba(39, 174, 96, 0.4); padding: 12px; border-radius: 10px; margin-bottom: 20px; text-align: center; font-size: 14px; display: none; }
    
    .bottom-link { text-align: center; margin-top: 25px; font-size: 14px; color: rgba(255,255,255,0.8); }
    .bottom-link p { margin-bottom: 5px; }
    .bottom-link a { color: #1aa6f8; text-decoration: none; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .bottom-link a:hover { color: #ffffff; text-decoration: underline; }
    
    #resend-btn { display: none; background: #d68910; margin-bottom: 15px; }
    #resend-btn:hover { background: #b9770e; }

    /* Responsive */
    @media(max-width: 768px) { 
      .box { padding: 30px 20px; }
    }
  </style>
</head>
<body>
  
  <!-- Header -->
  <header>
    <div class="header-container">
      <a href="index.html" class="logo">
        <img src="logo.jpg" alt="Logo" onerror="this.src='https://placehold.co/60x45/ffffff/0275ff?text=Brgy'">
        eBarangay Borongan
      </a>
      
      <a href="index.html" class="btn-header-back">
        ← Back to Home
      </a>
    </div>
  </header>

  <!-- Login Form Area -->
  <div class="login-wrapper">
    <div class="box">
      <h2>eBarangay Login</h2>

      <div class="error" id="error-box"></div>
      <div class="success" id="success-box"></div>

      <form id="login-form" onsubmit="return handleLogin(event)">
        <input type="email" id="login-input" placeholder="Enter your Email" required>
        
        <!-- Password with Text Toggle -->
        <div class="password-wrapper">
          <input type="password" id="login-password" placeholder="Enter your password" required>
          <span class="toggle-password" onclick="togglePassword('login-password', this)">Show</span>
        </div>

        <button type="submit" id="login-btn" class="btn">Login</button>
        <button type="button" id="resend-btn" class="btn" onclick="resendVerification()">Resend Verification Email</button>
      </form>

      <div class="bottom-link" id="bottom-links">
        <p>Doesn't have an account?</p>
        <a href="register.html">Register here</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://kbngzddelbmpdbhxevon.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_acy7Ulw_hTPGY4zPVSBUoA_xm0HeXb_';

    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

    // Function to toggle password visibility with text
    function togglePassword(inputId, element) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        element.textContent = 'Hide';
      } else {
        input.type = 'password';
        element.textContent = 'Show';
      }
    }

    function showError(msg) {
      const box = document.getElementById('error-box');
      box.textContent = msg; box.style.display = 'block';
      document.getElementById('success-box').style.display = 'none';
    }
    function showSuccess(msg) {
      const box = document.getElementById('success-box');
      box.textContent = msg; box.style.display = 'block';
      document.getElementById('error-box').style.display = 'none';
    }
    function clearMessages() {
      document.getElementById('error-box').style.display = 'none';
      document.getElementById('success-box').style.display = 'none';
      document.getElementById('resend-btn').style.display = 'none';
    }

    async function handleLogin(e) {
      e.preventDefault();
      clearMessages();
      const email = document.getElementById('login-input').value.trim();
      const password = document.getElementById('login-password').value;

      if (!email || !password) { showError('Please fill in all fields.'); return false; }

      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.textContent = 'Logging in...';

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      btn.disabled = false;
      btn.textContent = 'Login';

      if (error) {
        showError(error.message);
        if (error.message.toLowerCase().includes('email not confirmed')) {
          document.getElementById('resend-btn').style.display = 'block';
        }
        return false;
      }

      const role = data.user?.user_metadata?.role || 'resident';
      showSuccess('Login successful! Redirecting...');
      setTimeout(() => {
        window.location.href = role === 'admin' ? 'admin_dashboard.html' : 'resident_dashboard.html';
      }, 1500);
      return false;
    }

    async function resendVerification() {
      const email = document.getElementById('login-input').value.trim();
      if (!email) { showError('Please enter your email first.'); return; }

      const btn = document.getElementById('resend-btn');
      btn.disabled = true;
      btn.textContent = 'Sending...';

      const { error } = await supabaseClient.auth.resend({ type: 'signup', email: email });

      btn.disabled = false;
      btn.textContent = 'Resend Verification Email';

      if (error) {
        showError(error.message);
      } else {
        showSuccess('Verification email sent! Please check your inbox.');
        document.getElementById('resend-btn').style.display = 'none';
      }
    }
  </script>
</body>
</html>
