<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - eBarangay Borongan</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: linear-gradient(135deg, #3498db, #2980b9); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .box { background: white; padding: 40px; border-radius: 16px; width: 100%; max-width: 420px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    h2 { text-align: center; color: #2c3e50; margin-bottom: 10px; }
    
    /* Password wrapper styles */
    .password-wrapper { position: relative; margin-bottom: 15px; }
    .password-wrapper input { margin-bottom: 0; padding-right: 60px; }
    .toggle-password { 
      position: absolute; 
      right: 15px; 
      top: 50%; 
      transform: translateY(-50%); 
      cursor: pointer; 
      font-size: 13px; 
      color: #3498db; 
      font-weight: 600;
      user-select: none; 
    }
    .toggle-password:hover { color: #2980b9; text-decoration: underline; }

    input { width: 100%; padding: 12px 15px; border: 2px solid #ecf0f1; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
    input:focus { outline: none; border-color: #3498db; }
    
    .btn { width: 100%; padding: 14px; background: #3498db; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 16px; margin-bottom: 10px; transition: 0.3s; }
    .btn:hover { background: #2980b9; }
    .btn:disabled { background: #95a5a6; cursor: not-allowed; }
    .btn-green { background: #27ae60; }
    .btn-green:hover { background: #229954; }
    .btn-back { background: #95a5a6; text-decoration: none; display: block; text-align: center; color: white; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 15px; margin-bottom: 10px; transition: 0.3s; }
    .btn-back:hover { background: #7f8c8d; }
    .error { background: #f8d7da; color: #721c24; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-size: 14px; display: none; }
    .success { background: #d4edda; color: #155724; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-size: 14px; display: none; }
    .bottom-link { text-align: center; margin-top: 15px; font-size: 14px; }
    .bottom-link a { color: #3498db; text-decoration: none; font-weight: 600; cursor: pointer; }
    .bottom-link a:hover { text-decoration: underline; }
    #forgot-box { display: none; }
    h3 { text-align: center; margin-bottom: 15px; }
    
    #resend-btn { display: none; background: #e67e22; margin-bottom: 15px; }
    #resend-btn:hover { background: #d35400; }
  </style>
</head>
<body>
  <div class="box">
    <h2>eBarangay Login</h2>

    <div class="error" id="error-box"></div>
    <div class="success" id="success-box"></div>

    <form id="login-form" onsubmit="return handleLogin(event)">
      <input type="email" id="login-input" placeholder="Enter your Email" required>
      
      <!-- Password with Text Toggle -->
      <div class="password-wrapper">
        <input type="password" id="login-password" placeholder="Enter your password" required>
        <span class="toggle-password" onclick="togglePassword('login-password', this)">Show</span>
      </div>

      <button type="submit" id="login-btn" class="btn">Login</button>
      <button type="button" id="resend-btn" class="btn" onclick="resendVerification()">Resend Verification Email</button>
    </form>

    <div class="bottom-link" id="bottom-links">
      <a onclick="showForgot()">Forgot Password?</a>
      <p>Doesn't have an account?</p><a href="register.html">Register here</a>
    </div>

    <div id="forgot-box">
      <form onsubmit="return sendReset(event)">
        <h3>Reset Password</h3>
        <input type="email" id="forgot-input" placeholder="Enter your Email" required>
        <button type="submit" id="reset-btn" class="btn btn-green">Send Reset Link</button>
        <button type="button" class="btn" style="background:#95a5a6" onclick="backToLogin()">Back to Login</button>
      </form>
    </div>

    <a href="index.html" class="btn-back">← Back to Home</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://kbngzddelbmpdbhxevon.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_acy7Ulw_hTPGY4zPVSBUoA_xm0HeXb_';

    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

    // Function to toggle password visibility with text
    function togglePassword(inputId, element) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        element.textContent = 'Hide';
      } else {
        input.type = 'password';
        element.textContent = 'Show';
      }
    }

    function showError(msg) {
      const box = document.getElementById('error-box');
      box.textContent = msg; box.style.display = 'block';
      document.getElementById('success-box').style.display = 'none';
    }
    function showSuccess(msg) {
      const box = document.getElementById('success-box');
      box.textContent = msg; box.style.display = 'block';
      document.getElementById('error-box').style.display = 'none';
    }
    function clearMessages() {
      document.getElementById('error-box').style.display = 'none';
      document.getElementById('success-box').style.display = 'none';
      document.getElementById('resend-btn').style.display = 'none';
    }

    async function handleLogin(e) {
      e.preventDefault();
      clearMessages();
      const email = document.getElementById('login-input').value.trim();
      const password = document.getElementById('login-password').value;

      if (!email || !password) { showError('Please fill in all fields.'); return false; }

      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.textContent = 'Logging in...';

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      btn.disabled = false;
      btn.textContent = 'Login';

      if (error) {
        showError(error.message);
        if (error.message.toLowerCase().includes('email not confirmed')) {
          document.getElementById('resend-btn').style.display = 'block';
        }
        return false;
      }

      const role = data.user?.user_metadata?.role || 'resident';
      showSuccess('Login successful! Redirecting...');
      setTimeout(() => {
        window.location.href = role === 'admin' ? 'admin_dashboard.html' : 'resident_dashboard.html';
      }, 1500);
      return false;
    }

    async function resendVerification() {
      const email = document.getElementById('login-input').value.trim();
      if (!email) { showError('Please enter your email first.'); return; }

      const btn = document.getElementById('resend-btn');
      btn.disabled = true;
      btn.textContent = 'Sending...';

      const { error } = await supabaseClient.auth.resend({ type: 'signup', email: email });

      btn.disabled = false;
      btn.textContent = 'Resend Verification Email';

      if (error) {
        showError(error.message);
      } else {
        showSuccess('Verification email sent! Please check your inbox.');
        document.getElementById('resend-btn').style.display = 'none';
      }
    }

    function showForgot() {
      clearMessages();
      document.getElementById('login-form').style.display = 'none';
      document.getElementById('bottom-links').style.display = 'none';
      document.getElementById('forgot-box').style.display = 'block';
    }
    function backToLogin() {
      clearMessages();
      document.getElementById('login-form').style.display = 'block';
      document.getElementById('bottom-links').style.display = 'block';
      document.getElementById('forgot-box').style.display = 'none';
    }

    async function sendReset(e) {
      e.preventDefault();
      clearMessages();
      const email = document.getElementById('forgot-input').value.trim();
      if (!email) { showError('Please enter your email.'); return false; }

      const btn = document.getElementById('reset-btn');
      btn.disabled = true;
      btn.textContent = 'Sending...';

      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/update-password.html'
      });

      btn.disabled = false;
      btn.textContent = 'Send Reset Link';

      if (error) {
        showError(error.message);
      } else {
        showSuccess('Password reset link sent to your email!');
      }
      return false;
    }
  </script>
</body>
</html>
