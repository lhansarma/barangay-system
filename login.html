<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - eBarangay Borongan</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: linear-gradient(135deg, #3498db, #2980b9); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .box { background: white; padding: 40px; border-radius: 16px; width: 100%; max-width: 420px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    h2 { text-align: center; color: #2c3e50; margin-bottom: 10px; }
    input { width: 100%; padding: 12px 15px; border: 2px solid #ecf0f1; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; font-size: 15px; }
    input:focus { outline: none; border-color: #3498db; }
    .btn { width: 100%; padding: 14px; background: #3498db; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 16px; margin-bottom: 10px; transition: 0.3s; }
    .btn:hover { background: #2980b9; }
    .btn-green { background: #27ae60; }
    .btn-green:hover { background: #229954; }
    .btn-back { background: #95a5a6; text-decoration: none; display: block; text-align: center; color: white; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 15px; margin-bottom: 10px; transition: 0.3s; }
    .btn-back:hover { background: #7f8c8d; }
    .error { background: #f8d7da; color: #721c24; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-size: 14px; display: none; }
    .success { background: #d4edda; color: #155724; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-size: 14px; display: none; }
    .bottom-link { text-align: center; margin-top: 15px; font-size: 14px; }
    .bottom-link a { color: #3498db; text-decoration: none; font-weight: 600; cursor: pointer; }
    .bottom-link a:hover { text-decoration: underline; }
    #otp-box, #newpass-box, #forgot-box { display: none; }
    h3 { text-align: center; margin-bottom: 15px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>eBarangay Login</h2>

    <div class="error" id="error-box"></div>
    <div class="success" id="success-box"></div>

    <form id="login-form" onsubmit="return handleLogin(event)">
      <input type="text" id="login-input" placeholder="Enter Email or Username" required>
      <input type="password" id="login-password" placeholder="Enter your password" required>
      <button type="submit" class="btn">Login</button>
    </form>

    <div class="bottom-link" id="bottom-links">
      <a onclick="showForgot()">Forgot Password?</a>
      <p>Doesn't have an account?</p><a href="register.html">Register here</a>
    </div>

    <div id="forgot-box">
      <form onsubmit="return sendOTP(event)">
        <h3>Reset Password</h3>
        <input type="text" id="forgot-input" placeholder="Enter your Email or Username" required>
        <button type="submit" class="btn btn-green">Send OTP</button>
        <button type="button" class="btn" style="background:#95a5a6" onclick="backToLogin()">Back to Login</button>
      </form>
    </div>

    <div id="otp-box">
      <form onsubmit="return verifyOTP(event)">
        <h3>Enter OTP</h3>
        <input type="text" id="otp-input" placeholder="6 Digit OTP" maxlength="6" required>
        <button type="submit" class="btn btn-green">Verify OTP</button>
      </form>
    </div>

    <div id="newpass-box">
      <form onsubmit="return resetPassword(event)">
        <h3>New Password</h3>
        <input type="password" id="newpass-input" placeholder="Enter new password" required minlength="8">
        <button type="submit" class="btn btn-green">Reset Password</button>
      </form>
    </div>

    <a href="index.html" class="btn-back">← Back to Home</a>
  </div>

  <script>
    function getUsers() {
      const raw = localStorage.getItem('ebarangay_users');
      return raw ? JSON.parse(raw) : [];
    }
    function saveUsers(users) {
      localStorage.setItem('ebarangay_users', JSON.stringify(users));
    }
    function findUser(identifier) {
      const users = getUsers();
      const id = identifier.toLowerCase().trim();
      return users.find(u => u.email.toLowerCase() === id || u.username.toLowerCase() === id);
    }
    function showError(msg) {
      const box = document.getElementById('error-box');
      box.textContent = msg; box.style.display = 'block';
      document.getElementById('success-box').style.display = 'none';
    }
    function showSuccess(msg) {
      const box = document.getElementById('success-box');
      box.textContent = msg; box.style.display = 'block';
      document.getElementById('error-box').style.display = 'none';
    }
    function clearMessages() {
      document.getElementById('error-box').style.display = 'none';
      document.getElementById('success-box').style.display = 'none';
    }
    function hideAllForms() {
      document.getElementById('login-form').style.display = 'none';
      document.getElementById('forgot-box').style.display = 'none';
      document.getElementById('otp-box').style.display = 'none';
      document.getElementById('newpass-box').style.display = 'none';
      document.getElementById('bottom-links').style.display = 'none';
    }

    let resetState = { otp: null, email: null, time: null, verified: false };

    function handleLogin(e) {
      e.preventDefault();
      clearMessages();
      const input = document.getElementById('login-input').value.trim();
      const password = document.getElementById('login-password').value;

      if (!input || !password) { showError('Please fill in all fields.'); return false; }

      if (input.toLowerCase() === 'admin' && password === 'admin123') {
        localStorage.setItem('ebarangay_logged_in', JSON.stringify({
          username: 'admin', role: 'admin', fullname: 'Administrator'
        }));
        showSuccess('Login successful! Redirecting to admin dashboard...');
        setTimeout(() => { window.location.href = 'admin_dashboard.html'; }, 1500);
        return false;
      }

      const user = findUser(input);
      if (!user) { showError('Invalid email or password'); return false; }
      if (user.password !== password) { showError('Invalid email or password'); return false; }

      localStorage.setItem('ebarangay_logged_in', JSON.stringify({
        username: user.username, email: user.email, fullname: user.fullname, role: user.role
      }));

      showSuccess('Login successful! Redirecting to resident dashboard...');
      setTimeout(() => { window.location.href = 'resident_dashboard.html'; }, 1500);
      return false;
    }

    function showForgot() {
      clearMessages(); hideAllForms();
      document.getElementById('forgot-box').style.display = 'block';
      document.getElementById('bottom-links').style.display = 'block';
    }
    function backToLogin() {
      clearMessages(); hideAllForms();
      document.getElementById('login-form').style.display = 'block';
      document.getElementById('bottom-links').style.display = 'block';
    }

    function sendOTP(e) {
      e.preventDefault(); clearMessages();
      const email = document.getElementById('forgot-input').value.trim();
      if (!email) { showError('Please enter your email or username.'); return false; }
      const user = findUser(email);
      if (!user) { showError('Email/Username not found'); return false; }

      const otp = Math.floor(100000 + Math.random() * 900000).toString();
      resetState = { otp, email: user.email, time: Date.now(), verified: false };
      showSuccess('OTP Sent! (Demo OTP: ' + otp + ') - Valid for 5 minutes');
      document.getElementById('forgot-box').style.display = 'none';
      document.getElementById('otp-box').style.display = 'block';
      return false;
    }

    function verifyOTP(e) {
      e.preventDefault(); clearMessages();
      const input = document.getElementById('otp-input').value.trim();
      if (!resetState.otp) { showError('No OTP was sent. Please try again.'); return false; }
      if (Date.now() - resetState.time > 5 * 60 * 1000) { showError('OTP Expired'); return false; }
      if (input !== resetState.otp) { showError('Invalid OTP'); return false; }

      resetState.verified = true;
      showSuccess('OTP Verified. Set new password.');
      document.getElementById('otp-box').style.display = 'none';
      document.getElementById('newpass-box').style.display = 'block';
      return false;
    }

    function resetPassword(e) {
      e.preventDefault(); clearMessages();
      const newpass = document.getElementById('newpass-input').value;
      if (!resetState.verified) { showError('OTP not verified'); return false; }
      if (!newpass || newpass.length < 8) { showError('Password must be at least 8 characters.'); return false; }

      const users = getUsers();
      const idx = users.findIndex(u => u.email.toLowerCase() === resetState.email.toLowerCase());
      if (idx === -1) { showError('User not found. Please register again.'); return false; }
      users[idx].password = newpass;
      saveUsers(users);

      resetState = { otp: null, email: null, time: null, verified: false };
      showSuccess('Password changed successfully. You can now login.');
      hideAllForms();
      document.getElementById('login-form').style.display = 'block';
      document.getElementById('bottom-links').style.display = 'block';
      return false;
    }
  </script>
</body>
</html>
