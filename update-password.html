<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Password - eBarangay Borongan</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: linear-gradient(135deg, #3498db, #2980b9); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .box { background: white; padding: 40px; border-radius: 16px; width: 100%; max-width: 420px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
    input { width: 100%; padding: 12px 15px; border: 2px solid #ecf0f1; border-radius: 8px; margin-bottom: 15px; font-size: 15px; }
    input:focus { outline: none; border-color: #3498db; }
    .btn { width: 100%; padding: 14px; background: #3498db; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 16px; transition: 0.3s; }
    .btn:hover { background: #2980b9; }
    .btn:disabled { background: #95a5a6; cursor: not-allowed; }
    .btn-back { background: #95a5a6; text-decoration: none; display: block; text-align: center; color: white; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 15px; margin-top: 10px; transition: 0.3s; }
    .btn-back:hover { background: #7f8c8d; }
    .error { background: #f8d7da; color: #721c24; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-size: 14px; display: none; }
    .success { background: #d4edda; color: #155724; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-size: 14px; display: none; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Set New Password</h2>

    <div class="error" id="error-box"></div>
    <div class="success" id="success-box"></div>

    <form id="update-form" onsubmit="return handleUpdate(event)">
      <input type="password" id="new-password" placeholder="New password (min 8 chars)" required minlength="8">
      <input type="password" id="confirm-password" placeholder="Confirm new password" required minlength="8">
      <button type="submit" id="update-btn" class="btn">Update Password</button>
    </form>

    <a href="login.html" class="btn-back">← Back to Login</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://kbngzddelbmpdbhxevon.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_acy7Ulw_hTPGY4zPVSBUoA_xm0HeXb_';

    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

    function showError(msg) {
      const box = document.getElementById('error-box');
      box.textContent = msg; box.style.display = 'block';
      document.getElementById('success-box').style.display = 'none';
    }
    function showSuccess(msg) {
      const box = document.getElementById('success-box');
      box.textContent = msg; box.style.display = 'block';
      document.getElementById('error-box').style.display = 'none';
    }

    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        showSuccess('Recovery link verified. Enter your new password below.');
      }
    });

    async function handleUpdate(e) {
      e.preventDefault();
      const pw = document.getElementById('new-password').value;
      const confirm = document.getElementById('confirm-password').value;

      if (pw.length < 8) { showError('Password must be at least 8 characters.'); return false; }
      if (pw !== confirm) { showError('Passwords do not match.'); return false; }

      const btn = document.getElementById('update-btn');
      btn.disabled = true;
      btn.textContent = 'Updating...';

      const { error } = await supabaseClient.auth.updateUser({ password: pw });

      btn.disabled = false;
      btn.textContent = 'Update Password';

      if (error) {
        showError(error.message);
        return false;
      }

      showSuccess('Password updated! Redirecting to login...');
      setTimeout(() => { window.location.href = 'login.html'; }, 1500);
      return false;
    }
  </script>
</body>
</html>
