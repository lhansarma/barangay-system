<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Documents - eBarangay</title>
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: #f4f6f9; padding: 20px; margin: 0; }
  .header { background: #2c3e50; color: white; padding: 15px 30px; display: flex; justify-content: space-between; border-radius: 12px; margin-bottom: 20px; }
  .header a { color: white; text-decoration: none; margin-left: 10px; font-weight: bold; }
  .container { max-width: 1000px; margin: 0 auto; }
  .card { background: white; padding: 30px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  h2 { color: #2c3e50; margin-top: 0; margin-bottom: 20px; }
  label { display: block; font-weight: bold; color: #34495e; margin-bottom: 5px; }
  select, input[type="file"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 15px; }
  .btn { padding: 12px 20px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
  .btn:hover { background: #229954; }
  .btn:disabled { background: #95a5a6; cursor: not-allowed; }
  table { width: 100%; border-collapse: collapse; margin-top: 15px; }
  th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
  th { background: #2c3e50; color: white; }
  .status { padding: 5px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; background: #fff3cd; color: #856404; }
  .btn-small { padding: 6px 10px; font-size: 12px; border-radius: 5px; text-decoration: none; color: white; display: inline-block; margin: 2px; }
  .bg-blue { background: #3498db; } .bg-green { background: #16a085; }
  .error { background: #f8d7da; color: #721c24; padding: 12px; border-radius: 8px; margin-bottom: 20px; display: none; }
  .success { background: #d4edda; color: #155724; padding: 12px; border-radius: 8px; margin-bottom: 20px; display: none; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h3 style="margin:0;">eBarangay Borongan</h3>
    <span>Hi, <span id="user-name">User</span> | <a href="resident_dashboard.html">Dashboard</a> | <a href="#" onclick="handleLogout(event)">Logout</a></span>
  </div>

  <div class="error" id="error-box"></div>
  <div class="success" id="success-box"></div>

  <div class="card">
    <h2>📄 Upload Requirements</h2>
    <form id="upload-form" onsubmit="return handleUpload(event)">
      <label>Link to Request</label>
      <select id="request_id" required>
        <option value="">-- Select Pending Request --</option>
        <!-- Options loaded dynamically -->
      </select>

      <label>Document Type</label>
      <select id="document_type" required>
        <option value="Valid ID">Valid ID</option>
        <option value="Proof of Residency">Proof of Residency</option>
      </select>

      <label>Select File (PDF, JPG, PNG - Max 5MB)</label>
      <input type="file" id="document_file" accept=".pdf,.jpg,.jpeg,.png" required>

      <button type="submit" id="upload-btn" class="btn">Upload Document</button>
    </form>
  </div>

  <div class="card">
    <h2>My Submitted Documents</h2>
    <table>
      <thead>
        <tr>
          <th>Request</th>
          <th>Document</th>
          <th>File</th>
          <th>Preview</th>
          <th>Status</th>
          <th>Download</th>
        </tr>
      </thead>
      <tbody id="docs-table-body">
        <!-- Loaded dynamically -->
      </tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://kbngzddelbmpdbhxevon.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_acy7Ulw_hTPGY4zPVSBUoA_xm0HeXb_';
  const { createClient } = supabase;
  const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentUserId = null;

  async function init() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }
    
    currentUserId = session.user.id;
    document.getElementById('user-name').textContent = session.user.user_metadata?.full_name || session.user.email;

    loadRequests();
    loadDocuments();
  }

  // Load Pending Requests for the dropdown
  async function loadRequests() {
    const { data, error } = await supabaseClient
      .from('requests')
      .select('id, doc_type')
      .eq('user_id', currentUserId)
      .eq('status', 'Pending');

    if (error) { console.error(error); return; }
    
    const select = document.getElementById('request_id');
    select.innerHTML = '<option value="">-- Select Pending Request --</option>';
    
    if (data.length === 0) {
      select.innerHTML += '<option value="" disabled>No pending requests found</option>';
    } else {
      data.forEach(req => {
        select.innerHTML += `<option value="${req.id}">Request #${req.id} - ${req.doc_type}</option>`;
      });
    }
  }

  // Load Uploaded Documents table
  async function loadDocuments() {
    const { data, error } = await supabaseClient
      .from('documents')
      .select('*')
      .eq('resident_id', currentUserId)
      .order('id', { ascending: false });

    const tbody = document.getElementById('docs-table-body');
    tbody.innerHTML = '';

    if (error || data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No documents uploaded yet.</td></tr>';
      return;
    }

    data.forEach(doc => {
      tbody.innerHTML += `
        <tr>
          <td>Req #${doc.request_id}</td>
          <td>${doc.document_type}</td>
          <td>${doc.file_name}</td>
          <td><a href="${doc.file_path}" target="_blank" class="btn-small bg-blue">👁️ Preview</a></td>
          <td><span class="status">${doc.status}</span></td>
          <td><a href="${doc.file_path}" download class="btn-small bg-green">⬇️ DL</a></td>
        </tr>
      `;
    });
  }

  // Handle Form Submit & Supabase Storage Upload
  async function handleUpload(e) {
    e.preventDefault();
    const btn = document.getElementById('upload-btn');
    btn.disabled = true; btn.textContent = 'Uploading...';

    const reqId = document.getElementById('request_id').value;
    const docType = document.getElementById('document_type').value;
    const fileInput = document.getElementById('document_file');
    const file = fileInput.files[0];

    if (!file) { alert("Please select a file."); btn.disabled = false; btn.textContent = 'Upload Document'; return; }

    if (file.size > 5000000) {
      alert("File is too large. Max 5MB."); btn.disabled = false; btn.textContent = 'Upload Document'; return;
    }

    // 1. Upload file to Supabase Storage (Bucket name: 'documents')
    const fileExt = file.name.split('.').pop();
    const fileName = `${currentUserId}_${Date.now()}.${fileExt}`;
    const filePath = `${fileName}`;

    const { data: uploadData, error: uploadError } = await supabaseClient
      .storage
      .from('documents')
      .upload(filePath, file);

    if (uploadError) {
      alert("Upload failed: " + uploadError.message);
      btn.disabled = false; btn.textContent = 'Upload Document';
      return;
    }

    // 2. Get Public URL
    const { data: urlData } = supabaseClient.storage.from('documents').getPublicUrl(filePath);

    // 3. Save record to Database table
    const { error: dbError } = await supabaseClient
      .from('documents')
      .insert([{
        request_id: reqId,
        resident_id: currentUserId,
        document_type: docType,
        file_name: file.name,
        file_path: urlData.publicUrl,
        status: 'Pending'
      }]);

    btn.disabled = false; btn.textContent = 'Upload Document';

    if (dbError) {
      alert("Database error: " + dbError.message);
    } else {
      const sBox = document.getElementById('success-box');
      sBox.textContent = `✅ Document uploaded and linked to Request #${reqId}`;
      sBox.style.display = 'block';
      document.getElementById('upload-form').reset();
      loadDocuments(); // Refresh table
    }
  }

  async function handleLogout(e) {
    e.preventDefault();
    await supabaseClient.auth.signOut();
    window.location.href = 'login.html';
  }

  init();
</script>
</body>
</html>
